<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6f43" />
  <title>CityLap — find a running loop</title>

  <!-- Leaflet from CDN (map + free OpenStreetMap raster tiles). No build step. -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
    defer
  ></script>

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <h1>CityLap</h1>
    <p class="tagline">Find a running or walking loop near you.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-label="Controls">
      <!-- 1. Where to search -->
      <fieldset class="group">
        <legend>Start point</legend>
        <button id="geolocate" type="button" class="btn">Use my location</button>
        <div class="or">or</div>
        <form id="address-form" class="address-row" autocomplete="off">
          <input
            id="address-input"
            type="text"
            inputmode="text"
            placeholder="Type an address or place"
            aria-label="Address"
          />
          <button type="submit" class="btn btn-secondary">Find</button>
        </form>
        <p id="start-readout" class="readout" aria-live="polite"></p>
      </fieldset>

      <!-- 2. Loop shape -->
      <fieldset class="group">
        <legend>Target loop distance</legend>
        <div class="presets" role="group" aria-label="Distance presets">
          <button type="button" class="chip" data-miles="0.25">0.25 mi</button>
          <button type="button" class="chip is-active" data-miles="0.5">0.5 mi</button>
          <button type="button" class="chip" data-miles="1">1.0 mi</button>
        </div>
        <label class="field">
          <span>Custom (miles)</span>
          <input id="distance-custom" type="number" min="0.1" max="10" step="0.05" placeholder="e.g. 0.75" />
        </label>
        <label class="field">
          <span>Tolerance ± (miles)</span>
          <input id="tolerance" type="number" min="0.02" max="2" step="0.05" value="0.15" />
        </label>
        <label class="field">
          <span>Search radius</span>
          <select id="radius">
            <option value="1609">1 mile</option>
            <option value="3219" selected>2 miles</option>
          </select>
        </label>
      </fieldset>

      <button id="find-loops" type="button" class="btn btn-primary" disabled>
        Find loops
      </button>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <ol id="results" class="results" aria-label="Candidate loops"></ol>
    </section>

    <section class="map-wrap" aria-label="Map">
      <div id="map"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
